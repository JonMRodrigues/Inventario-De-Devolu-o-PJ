<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AUDITORIA DE DEVOLUÇÕES</title>


  <!-- =======================================================
       BIBLIOTECA SHEETJS - EXCEL
  ======================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
  </script>


  <!-- =======================================================
       BIBLIOTECA JSPDF - PDF
  ======================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
  </script>


  <!-- =======================================================
       BIBLIOTECA AUTOTABLE - TABELA DO PDF
  ======================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js">
  </script>


  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Tahoma, Verdana, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0 0 30px;
      min-height: 100vh;
      color: #000;
      background:
        radial-gradient(ellipse 120% 40% at 30% 100%, #4f9a2c 0%, #3d8a1f 55%, transparent 56%),
        radial-gradient(ellipse 100% 35% at 90% 105%, #62b13a 0%, #4a9a26 55%, transparent 56%),
        linear-gradient(#2f6fd6 0%, #6aa8f0 55%, #bfe0ff 100%);
      background-attachment: fixed;
    }

    /* Barra de título azul estilo XP */
    .header-banner {
      background: linear-gradient(#3a8cff 0%, #0a5be0 12%, #0950d4 50%, #0a4bc8 88%, #0b3fa8 100%);
      color: white;
      padding: 14px 20px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 1px 1px 1px #0a2a80;
      margin-bottom: 24px;
      border-bottom: 3px solid #0a3fc4;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #top-info {
      display: block;
      width: fit-content;
      max-width: 94%;
      margin: 0 auto 20px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      color: #0a2a80;
      background: linear-gradient(90deg, #fff 0%, #dce8ff 100%);
      border: 1px solid #7f9db9;
      border-radius: 4px;
      box-shadow: 2px 3px 8px rgba(0,0,0,.3);
    }

    .form-container {
      display: inline-block;
      text-align: left;
      margin-bottom: 24px;
      max-width: 400px;
      width: 100%;
      padding: 16px 16px 12px;
      background: #ece9d8;
      border: 3px solid #0a3fc4;
      border-radius: 9px 9px 4px 4px;
      box-shadow: 4px 6px 18px rgba(0,0,0,.5);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      text-align: center;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #0046d5;
    }

    select,
    input[type="text"] {
      width: 100%;
      height: 36px;
      font-size: 16px;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      border: 1px solid #7f9db9;
      display: block;
      margin: 0 auto;
      padding: 0 8px;
      border-radius: 2px;
      background-color: white;
    }

    select:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #316ac5;
      box-shadow: 0 0 0 2px #b9d1f7;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      border: 1px solid #003c74;
      background: linear-gradient(#fff 0%, #ece9d8 85%, #d6d0c0 100%);
      border-radius: 6px;
    }

    button:hover {
      border-color: #e8a317;
      box-shadow: inset 0 0 0 2px #fbd36b;
    }

    button:active {
      background: #d6d0c0;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      box-shadow: none;
    }

    /* Botão enviar */
    #btn-enviar {
      display: block;
      width: 100%;
      margin: 0 auto 10px auto;
      font-size: 15px;
      color: #fff;
      text-shadow: 1px 1px 1px #145a0a;
      border: 1px solid #1a6b0e;
      border-radius: 12px;
      background: linear-gradient(#6fd45a 0%, #3ea82b 50%, #2d8f1c 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }

    #btn-enviar:hover {
      filter: brightness(1.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }

    /* Botões principais */
    #botoes-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding: 0 10px;
    }

    #botoes-container button {
      flex: 1;
      min-width: 130px;
      max-width: 190px;
      color: #fff;
      text-shadow: 1px 1px 1px #0a2a80;
      border: 1px solid #0a3fc4;
      border-radius: 12px;
      background: linear-gradient(#6aa3ff 0%, #2a6ee8 50%, #1352c8 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    #botoes-container button:hover {
      filter: brightness(1.1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    /* Tabela */
    table {
      border-collapse: collapse;
      width: 90%;
      max-width: 900px;
      margin: 0 auto 30px auto;
      font-size: 15px;
      background-color: white;
    }

    th,
    td {
      border: 1px solid #aca899;
      padding: 8px;
      text-align: center;
      word-break: break-word;
    }

    th {
      background: linear-gradient(#fff, #ece9d8);
      color: #0a2a80;
    }

    /* Modal da tabela */
    #modal-tabela {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ece9d8;
      z-index: 1000;
      flex-direction: column;
      padding-top: 100px;
      align-items: center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #modal-tabela::before {
      content: "📋 Consulta - Peças bipadas";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      padding: 8px 12px;
      text-align: left;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 1px 1px 1px #0a2a80;
      background: linear-gradient(#3a8cff 0%, #0a5be0 12%, #0950d4 50%, #0a4bc8 88%, #0b3fa8 100%);
      z-index: 1050;
    }

    #modal-tabela #tabela {
      flex: 0 0 auto;
      margin-bottom: 30px;
    }

    #modal-botoes-topo {
      position: fixed;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 1100;
    }

    #modal-botoes-topo button {
      padding: 8px 25px;
      font-size: 15px;
      color: #fff;
      text-shadow: 1px 1px 1px #0a2a80;
      border: 1px solid #0a3fc4;
      border-radius: 12px;
      background: linear-gradient(#6aa3ff 0%, #2a6ee8 50%, #1352c8 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    .hidden {
      display: none !important;
    }

    /* Mensagens */
    #mensagem-erro,
    #mensagem-limite {
      color: #c0392b;
      font-weight: bold;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
    }

    /* Rodapé */
    #rodape {
      display: block;
      width: fit-content;
      margin: 10px auto 0;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: bold;
      color: #0a2a80;
      background: #fffbe0;
      border: 1px solid #7f9db9;
      border-radius: 4px;
      box-shadow: 2px 3px 8px rgba(0,0,0,.3);
    }

    /* Janelas de confirmação e avisos */
    #confirmacao-exportar,
    #confirmacao-limpar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,40,0.5);
      z-index: 1200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #confirmacao-exportar > div,
    #confirmacao-limpar > div {
      position: relative;
      background: #ece9d8;
      padding: 48px 20px 20px;
      border: 3px solid #0a3fc4;
      border-radius: 9px 9px 4px 4px;
      box-shadow: 4px 6px 18px rgba(0,0,0,.6);
      text-align: center;
      max-width: 340px;
      width: calc(100% - 40px);
    }

    #confirmacao-exportar > div::before,
    #confirmacao-limpar > div::before {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      padding: 7px 10px;
      text-align: left;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 1px 1px 1px #0a2a80;
      background: linear-gradient(#3a8cff 0%, #0a5be0 12%, #0950d4 50%, #0a4bc8 88%, #0b3fa8 100%);
      border-radius: 6px 6px 0 0;
    }

    #confirmacao-exportar > div::before { content: "💾 Exportar"; }
    #confirmacao-limpar > div::before { content: "🗑️ Limpar tudo"; }

    #confirmacao-exportar p,
    #confirmacao-limpar p {
      margin-top: 0;
      font-size: 14px;
    }

    #confirmacao-exportar button,
    #confirmacao-limpar button {
      margin: 10px 5px 0 5px;
      width: 90px;
      padding: 8px;
    }

    @media (max-width: 600px) {

      .header-banner {
        font-size: 17px;
        padding: 12px 10px;
      }

      #top-info {
        font-size: 14px;
      }

      #botoes-container {
        flex-direction: column;
        align-items: center;
      }

      #botoes-container button {
        width: 100%;
        max-width: 300px;
      }

      table {
        width: 98%;
        font-size: 13px;
      }

      th,
      td {
        padding: 7px 4px;
      }

      #modal-tabela {
        padding-top: 130px;
      }

      #modal-botoes-topo {
        gap: 8px;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }

      #modal-botoes-topo button {
        padding: 8px 14px;
        font-size: 13px;
      }

    }
  </style>

</head>


<body>


  <!-- =======================================================
       CABEÇALHO
  ======================================================== -->

  <div class="header-banner">
    AUDITORIA DE DEVOLUÇÕES
  </div>


  <!-- =======================================================
       INFORMAÇÕES
  ======================================================== -->

  <div id="top-info">

    QTD Bipada:
    <span id="contador">0</span>

    |

    Último código:
    <span id="ultimo-codigo">-</span>

  </div>


  <!-- =======================================================
       FORMULÁRIO
  ======================================================== -->

  <form
    class="form-container"
    id="meuFormulario"
  >


    <!-- AUDITOR -->

    <div class="form-group">

      <label for="base">
        AUDITOR
      </label>


      <select
        id="base"
        required
      >

        <option
          value=""
          disabled
          selected
        >
          Selecione o AUDITOR
        </option>

<option value="Jonathan D M Rodrigues">Jonathan D M Rodrigues</option>

        <option value="OUTROS">
          OUTROS
        </option>

      </select>

    </div>



    <!-- PJ -->

    <div class="form-group">

      <label for="setor">
        PJ
      </label>


      <select
        id="setor"
        required
      >

        <option
          value=""
          disabled
          selected
        >
          Selecione o PJ
        </option>


        <option value="DEVOLUÇÃO ALFA">
          DEVOLUÇÃO-ALFA
        </option>


        <option value="DEVOLUÇÃO BETA">
          DEVOLUÇÃO-BETA
        </option>


        <option value="DEVOLUÇÃO GAMA">
          DEVOLUÇÃO-GAMA
        </option>


        <option value="DEVOLUÇÃO DELTA">
          DEVOLUÇÃO-DELTA
        </option>


        <option value="DEVOLUÇÃO SIGMA">
          DEVOLUÇÃO-SIGMA
        </option>


        <option value="DEVOLUÇÃO OUTROS">
          DEVOLUÇÃO-OUTROS
        </option>


      </select>

    </div>


    <!-- CÓDIGO -->

    <div class="form-group">

      <label for="codigo">
        CÓDIGO
      </label>


      <input
        type="text"
        id="codigo"
        required
        autocomplete="off"
        inputmode="text"
      />

    </div>


    <!-- ENVIAR -->

    <button
      type="submit"
      id="btn-enviar"
    >
      ENVIAR
    </button>


    <div id="mensagem-erro"></div>

    <div id="mensagem-limite"></div>

  </form>


  <!-- =======================================================
       BOTÕES PRINCIPAIS
  ======================================================== -->

  <div id="botoes-container">


    <button id="botao-tabela">
      Consultar Peças
    </button>


    <button id="botao-exportar">
      Exportar Excel + PDF
    </button>


    <button id="botao-exportar-pdf">
      Exportar Excel + PDF
    </button>


    <button id="botao-limpar">
      Limpar tudo
    </button>


  </div>


  <!-- =======================================================
       MODAL / TABELA
  ======================================================== -->

  <div id="modal-tabela">


    <div id="modal-botoes-topo">


      <button id="botao-ocultar">
        Voltar
      </button>


      <button id="botao-exportar-modal">
        Exportar Excel + PDF
      </button>


      <button id="botao-exportar-pdf-modal">
        Exportar Excel + PDF
      </button>


    </div>


    <table id="tabela">


      <thead>

        <tr>

          <th>
            AUDITOR
          </th>


          <th>
            PJ
          </th>


          <th>
            CÓDIGO
          </th>


          <th>
            Data/Hora
          </th>

        </tr>

      </thead>


      <tbody></tbody>


    </table>


  </div>


  <!-- =======================================================
       RODAPÉ
  ======================================================== -->

  <div id="rodape">

    Restantes:
    <span id="restantes">
      2500
    </span>

  </div>


  <!-- =======================================================
       CONFIRMAÇÃO EXPORTAR
  ======================================================== -->

  <div id="confirmacao-exportar">


    <div>


      <p>
        Serão baixados o Excel e o PDF.
        <br><br>
        Após exportar, a auditoria será reiniciada.
        <br><br>
        Deseja continuar?
      </p>


      <button id="confirmar-sim-exportar">
        Sim
      </button>


      <button id="confirmar-nao-exportar">
        Não
      </button>


    </div>


  </div>


  <!-- =======================================================
       CONFIRMAÇÃO LIMPAR
  ======================================================== -->

  <div id="confirmacao-limpar">


    <div>


      <p>
        Todos os dados serão apagados.
        Deseja continuar?
      </p>


      <button id="confirmar-sim-limpar">
        Sim
      </button>


      <button id="confirmar-nao-limpar">
        Não
      </button>


    </div>


  </div>


  <script>


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const form =
      document.getElementById(
        "meuFormulario"
      );


    const tabelaBody =
      document.querySelector(
        "#tabela tbody"
      );


    const contador =
      document.getElementById(
        "contador"
      );


    const ultimoCodigo =
      document.getElementById(
        "ultimo-codigo"
      );


    const restantes =
      document.getElementById(
        "restantes"
      );


    const btnEnviar =
      document.getElementById(
        "btn-enviar"
      );


    const erroMsg =
      document.getElementById(
        "mensagem-erro"
      );


    const limiteMsg =
      document.getElementById(
        "mensagem-limite"
      );


    const modalTabela =
      document.getElementById(
        "modal-tabela"
      );


    const botaoTabela =
      document.getElementById(
        "botao-tabela"
      );


    const botaoOcultar =
      document.getElementById(
        "botao-ocultar"
      );


    const botaoExportar =
      document.getElementById(
        "botao-exportar"
      );


    const botaoExportarModal =
      document.getElementById(
        "botao-exportar-modal"
      );


    const botaoExportarPdf =
      document.getElementById(
        "botao-exportar-pdf"
      );


    const botaoExportarPdfModal =
      document.getElementById(
        "botao-exportar-pdf-modal"
      );


    const botaoLimpar =
      document.getElementById(
        "botao-limpar"
      );


    const confirmacaoExportar =
      document.getElementById(
        "confirmacao-exportar"
      );


    const btnSimExportar =
      document.getElementById(
        "confirmar-sim-exportar"
      );


    const btnNaoExportar =
      document.getElementById(
        "confirmar-nao-exportar"
      );


    const confirmacaoLimpar =
      document.getElementById(
        "confirmacao-limpar"
      );


    const btnSimLimpar =
      document.getElementById(
        "confirmar-sim-limpar"
      );


    const btnNaoLimpar =
      document.getElementById(
        "confirmar-nao-limpar"
      );


    const selectBase =
      document.getElementById(
        "base"
      );


    const selectSetor =
      document.getElementById(
        "setor"
      );


    const inputCodigo =
      document.getElementById(
        "codigo"
      );


    const topInfo =
      document.getElementById(
        "top-info"
      );


    const rodape =
      document.getElementById(
        "rodape"
      );


    // =========================================================
    // CONFIGURAÇÕES
    // =========================================================

    const LIMITE =
      2500;


    const STORAGE_DADOS =
      "dadosInventario";


    const STORAGE_BASE =
      "ultimoBase";


    const STORAGE_SETOR =
      "ultimoSetor";


    // =========================================================
    // CARREGAMENTO DOS DADOS
    // =========================================================

    let dados = [];


    try {


      const dadosSalvos =
        localStorage.getItem(
          STORAGE_DADOS
        );


      dados =
        dadosSalvos
          ? JSON.parse(dadosSalvos)
          : [];


      if (!Array.isArray(dados)) {

        dados = [];

      }


    } catch (erro) {


      console.error(
        "Erro ao carregar dados:",
        erro
      );


      dados = [];

    }


    // =========================================================
    // SALVAR DADOS
    // =========================================================

    function salvarDados() {


      try {


        localStorage.setItem(
          STORAGE_DADOS,
          JSON.stringify(dados)
        );


      } catch (erro) {


        console.error(
          "Erro ao salvar dados:",
          erro
        );


        erroMsg.textContent =
          "Erro ao salvar os dados no navegador.";

      }

    }


    // =========================================================
    // SALVAR ÚLTIMOS SELECIONADOS
    // =========================================================

    function salvarUltimosSelects() {


      try {


        if (selectBase.value) {


          localStorage.setItem(
            STORAGE_BASE,
            selectBase.value
          );


        }


        if (selectSetor.value) {


          localStorage.setItem(
            STORAGE_SETOR,
            selectSetor.value
          );


        }


      } catch (erro) {


        console.error(
          "Erro ao salvar seleções:",
          erro
        );


      }

    }


    // =========================================================
    // LIMPAR ÚLTIMOS SELECIONADOS
    // =========================================================

    function limparUltimosSelects() {


      localStorage.removeItem(
        STORAGE_BASE
      );


      localStorage.removeItem(
        STORAGE_SETOR
      );

    }


    // =========================================================
    // CARREGAR ÚLTIMOS SELECIONADOS
    // =========================================================

    function carregarUltimosSelects() {


      const baseSalvo =
        localStorage.getItem(
          STORAGE_BASE
        );


      const setorSalvo =
        localStorage.getItem(
          STORAGE_SETOR
        );


      if (baseSalvo) {


        selectBase.value =
          baseSalvo;


      } else {


        selectBase.value =
          "";

      }


      if (setorSalvo) {


        selectSetor.value =
          setorSalvo;


      } else {


        selectSetor.value =
          "";

      }

    }


    // =========================================================
    // ATUALIZAR INTERFACE
    // =========================================================

    function atualizarUI() {


      tabelaBody.innerHTML =
        "";


      dados.forEach(
        (dado) => {


          const row =
            tabelaBody.insertRow();


          row.insertCell(0).textContent =
            dado.base;


          row.insertCell(1).textContent =
            dado.setor;


          row.insertCell(2).textContent =
            dado.codigo;


          row.insertCell(3).textContent =
            dado.dataHora;


        }
      );


      contador.textContent =
        dados.length;


      const quantidadeRestante =
        Math.max(
          0,
          LIMITE - dados.length
        );


      restantes.textContent =
        quantidadeRestante;


      if (dados.length >= LIMITE) {


        btnEnviar.disabled =
          true;


        limiteMsg.textContent =
          "Limite atingido. Para continuar, exporte os dados inseridos até agora.";


      } else {


        btnEnviar.disabled =
          false;


        limiteMsg.textContent =
          "";

      }

    }


    // =========================================================
    // ENVIO / BIPAGEM
    // =========================================================

    form.addEventListener(
      "submit",
      function (e) {


        e.preventDefault();


        erroMsg.textContent =
          "";


        const base =
          selectBase.value.trim();


        const setor =
          selectSetor.value.trim();


        let codigo =
          inputCodigo.value
            .trim()
            .toUpperCase();


        // -----------------------------------------------------
        // VALIDAR AUDITOR
        // -----------------------------------------------------

        if (!base) {


          erroMsg.textContent =
            "Por favor, selecione o AUDITOR.";


          selectBase.focus();


          return;

        }


        // -----------------------------------------------------
        // VALIDAR PJ
        // -----------------------------------------------------

        if (!setor) {


          erroMsg.textContent =
            "Por favor, selecione o PJ.";


          selectSetor.focus();


          return;

        }


        // -----------------------------------------------------
        // VALIDAR CÓDIGO
        // -----------------------------------------------------

        if (!codigo) {


          erroMsg.textContent =
            "Digite ou bipe um código.";


          inputCodigo.focus();


          return;

        }


        // -----------------------------------------------------
        // VALIDAR CARACTERES
        // -----------------------------------------------------

        if (!/^[A-Z0-9]+$/.test(codigo)) {


          erroMsg.textContent =
            "Somente letras e números são permitidos.";


          inputCodigo.focus();


          return;

        }


        // -----------------------------------------------------
        // VERIFICAR DUPLICIDADE
        // -----------------------------------------------------

        const codigoJaExiste =
          dados.some(
            (dado) =>
              dado.codigo === codigo
          );


        if (codigoJaExiste) {


          erroMsg.textContent =
            "Código já bipado.";


          inputCodigo.select();


          return;

        }


        // -----------------------------------------------------
        // VERIFICAR LIMITE
        // -----------------------------------------------------

        if (dados.length >= LIMITE) {


          erroMsg.textContent =
            "Limite atingido. Não é possível adicionar mais.";


          return;

        }


        // -----------------------------------------------------
        // DATA E HORA
        // -----------------------------------------------------

        const dataHora =
          new Date().toLocaleString(
            "pt-BR"
          );


        // -----------------------------------------------------
        // ADICIONAR REGISTRO
        // -----------------------------------------------------

        dados.push({

          base:
            base,

          setor:
            setor,

          codigo:
            codigo,

          dataHora:
            dataHora

        });


        // -----------------------------------------------------
        // SALVAR
        // -----------------------------------------------------

        salvarDados();

        salvarUltimosSelects();


        // -----------------------------------------------------
        // ATUALIZAR TELA
        // -----------------------------------------------------

        ultimoCodigo.textContent =
          codigo;


        inputCodigo.value =
          "";


        atualizarUI();


        inputCodigo.focus();


      }
    );


    // =========================================================
    // CONSULTAR PEÇAS
    // =========================================================

    botaoTabela.onclick =
      function () {


        modalTabela.style.display =
          "flex";


        form.classList.add(
          "hidden"
        );


        botaoTabela.classList.add(
          "hidden"
        );


        botaoExportar.classList.add(
          "hidden"
        );


        botaoExportarPdf.classList.add(
          "hidden"
        );


        botaoLimpar.classList.add(
          "hidden"
        );


        topInfo.classList.add(
          "hidden"
        );


        rodape.classList.add(
          "hidden"
        );


        erroMsg.textContent =
          "";


        limiteMsg.textContent =
          "";

      };


    // =========================================================
    // VOLTAR
    // =========================================================

    botaoOcultar.onclick =
      function () {


        modalTabela.style.display =
          "none";


        form.classList.remove(
          "hidden"
        );


        botaoTabela.classList.remove(
          "hidden"
        );


        botaoExportar.classList.remove(
          "hidden"
        );


        botaoExportarPdf.classList.remove(
          "hidden"
        );


        botaoLimpar.classList.remove(
          "hidden"
        );


        topInfo.classList.remove(
          "hidden"
        );


        rodape.classList.remove(
          "hidden"
        );


        inputCodigo.focus();

      };


    // =========================================================
    // FORMATAR TEXTO PARA NOME DE ARQUIVO
    // =========================================================

    function formatarTexto(texto) {


      return texto

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .replace(
          /[^a-zA-Z0-9]+/g,
          "-"
        )

        .replace(
          /-+/g,
          "-"
        )

        .replace(
          /^-|-$/g,
          ""
        )

        .toUpperCase();

    }


    // =========================================================
    // GERAR DATA PARA NOME DO ARQUIVO
    // =========================================================

    function gerarDataNomeArquivo() {


      const agora =
        new Date();


      const dia =
        String(
          agora.getDate()
        ).padStart(2, "0");


      const mes =
        String(
          agora.getMonth() + 1
        ).padStart(2, "0");


      const ano =
        agora.getFullYear();


      const hora =
        String(
          agora.getHours()
        ).padStart(2, "0");


      const minuto =
        String(
          agora.getMinutes()
        ).padStart(2, "0");


      const segundo =
        String(
          agora.getSeconds()
        ).padStart(2, "0");


      return {

        agora,

        dia,

        mes,

        ano,

        hora,

        minuto,

        segundo

      };

    }


    // =========================================================
    // EXPORTAR EXCEL
    // =========================================================

    function exportarExcel() {


      if (dados.length === 0) {


        alert(
          "Não existem dados para exportar."
        );


        return false;

      }


      const linhas = [


        [

          "AUDITOR",

          "PJ",

          "CODIGO",

          "Data/Hora"

        ],


        ...dados.map(
          (dado) => [


            dado.base,

            dado.setor,

            dado.codigo,

            dado.dataHora


          ]
        )


      ];


      const worksheet =
        XLSX.utils.aoa_to_sheet(
          linhas
        );


      worksheet["!cols"] = [


        {
          wch: 25
        },


        {
          wch: 35
        },


        {
          wch: 20
        },


        {
          wch: 22
        }


      ];


      const workbook =
        XLSX.utils.book_new();


      XLSX.utils.book_append_sheet(

        workbook,

        worksheet,

        "DEVOLUCOES"

      );


      const dataArquivo =
        gerarDataNomeArquivo();


      const baseNome =
        formatarTexto(

          dados[0]?.base ||

          selectBase.value ||

          "SEM-BASE"

        );


      const setorNome =
        formatarTexto(

          dados[0]?.setor ||

          selectSetor.value ||

          "SEM-SETOR"

        );


      const nomeArquivo =

        `AUDITORIA-DEVOLUCOES-${baseNome}-${setorNome}-${dataArquivo.dia}-${dataArquivo.mes}-${dataArquivo.ano}-${dataArquivo.hora}h${dataArquivo.minuto}m${dataArquivo.segundo}s.xlsx`;


      XLSX.writeFile(

        workbook,

        nomeArquivo

      );


      return true;

    }


    // =========================================================
    // EXPORTAR PDF
    // =========================================================

    function exportarPDF() {


      if (dados.length === 0) {


        alert(
          "Não existem dados para exportar."
        );


        return false;

      }


      if (
        !window.jspdf ||
        !window.jspdf.jsPDF
      ) {


        alert(
          "Não foi possível carregar a biblioteca de PDF. Verifique sua conexão com a internet e tente novamente."
        );


        return false;

      }


      const {
        jsPDF
      } = window.jspdf;


      const doc =
        new jsPDF({

          orientation:
            "landscape",

          unit:
            "mm",

          format:
            "a4"

        });


      const dataArquivo =
        gerarDataNomeArquivo();


      const auditor =
        dados[0]?.base ||

        selectBase.value ||

        "SEM AUDITOR";


      const setor =
        dados[0]?.setor ||

        selectSetor.value ||

        "SEM PJ";


      const baseNome =
        formatarTexto(
          auditor
        );


      const setorNome =
        formatarTexto(
          setor
        );


      const nomeArquivo =

        `AUDITORIA-DEVOLUCOES-${baseNome}-${setorNome}-${dataArquivo.dia}-${dataArquivo.mes}-${dataArquivo.ano}-${dataArquivo.hora}h${dataArquivo.minuto}m${dataArquivo.segundo}s.pdf`;


      // -------------------------------------------------------
      // CABEÇALHO
      // -------------------------------------------------------

      doc.setFillColor(
        10,
        75,
        200
      );


      doc.rect(
        0,
        0,
        297,
        22,
        "F"
      );


      // -------------------------------------------------------
      // TÍTULO
      // -------------------------------------------------------

      doc.setTextColor(
        255,
        255,
        255
      );


      doc.setFont(
        "helvetica",
        "bold"
      );


      doc.setFontSize(
        17
      );


      doc.text(

        "AUDITORIA DE DEVOLUÇÕES",

        148.5,

        14,

        {
          align:
            "center"
        }

      );


      // -------------------------------------------------------
      // INFORMAÇÕES
      // -------------------------------------------------------

      doc.setTextColor(
        0,
        0,
        0
      );


      doc.setFont(
        "helvetica",
        "normal"
      );


      doc.setFontSize(
        10
      );


      doc.text(

        `Auditor: ${auditor}`,

        14,

        30

      );


      doc.text(

        `PJ: ${setor}`,

        14,

        36

      );


      doc.text(

        `Quantidade de registros: ${dados.length}`,

        14,

        42

      );


      doc.text(

        `Exportado em: ${dataArquivo.agora.toLocaleString("pt-BR")}`,

        14,

        48

      );


      // -------------------------------------------------------
      // DADOS
      // -------------------------------------------------------

      const linhasPDF =

        dados.map(

          (dado) => [

            dado.base,

            dado.setor,

            dado.codigo,

            dado.dataHora

          ]

        );


      // -------------------------------------------------------
      // TABELA PDF
      // -------------------------------------------------------

      doc.autoTable({

        startY:
          54,

        head: [

          [

            "AUDITOR",

            "PJ",

            "CÓDIGO",

            "DATA/HORA"

          ]

        ],

        body:
          linhasPDF,

        theme:
          "grid",

        styles: {

          font:
            "helvetica",

          fontSize:
            8,

          cellPadding:
            3,

          halign:
            "center",

          valign:
            "middle",

          lineColor: [

            0,

            0,

            0

          ],

          lineWidth:
            0.2

        },

        headStyles: {

          fillColor: [

            10,

            75,

            200

          ],

          textColor: [

            255,

            255,

            255

          ],

          fontStyle:
            "bold",

          halign:
            "center"

        },

        alternateRowStyles: {

          fillColor: [

            245,

            245,

            245

          ]

        },

        columnStyles: {

          0: {

            cellWidth:
              55

          },

          1: {

            cellWidth:
              75

          },

          2: {

            cellWidth:
              45

          },

          3: {

            cellWidth:
              55

          }

        },

        margin: {

          left:
            14,

          right:
            14

        }

      });


      // -------------------------------------------------------
      // RODAPÉ
      // -------------------------------------------------------

      const totalPaginas =

        doc.internal.getNumberOfPages();


      for (
        let pagina = 1;
        pagina <= totalPaginas;
        pagina++
      ) {


        doc.setPage(
          pagina
        );


        doc.setFontSize(
          8
        );


        doc.setTextColor(
          100,
          100,
          100
        );


        doc.text(

          `Página ${pagina} de ${totalPaginas}`,

          148.5,

          205,

          {
            align:
              "center"
          }

        );

      }


      // -------------------------------------------------------
      // DOWNLOAD
      // -------------------------------------------------------

      doc.save(
        nomeArquivo
      );


      return true;

    }


    // =========================================================
    // EXPORTAR EXCEL + PDF
    // =========================================================

    function exportarExcelEPDF() {


      if (dados.length === 0) {


        alert(
          "Não existem dados para exportar."
        );


        return false;

      }


      // -------------------------------------------------------
      // VERIFICAR EXCEL
      // -------------------------------------------------------

      if (
        typeof XLSX ===
        "undefined"
      ) {


        alert(
          "A biblioteca do Excel não foi carregada."
        );


        return false;

      }


      // -------------------------------------------------------
      // VERIFICAR PDF
      // -------------------------------------------------------

      if (
        !window.jspdf ||
        !window.jspdf.jsPDF
      ) {


        alert(
          "A biblioteca do PDF não foi carregada."
        );


        return false;

      }


      // -------------------------------------------------------
      // EXPORTAR EXCEL
      // -------------------------------------------------------

      const excelExportado =
        exportarExcel();


      if (!excelExportado) {


        return false;

      }


      // -------------------------------------------------------
      // EXPORTAR PDF
      // -------------------------------------------------------

      const pdfExportado =
        exportarPDF();


      if (!pdfExportado) {


        alert(
          "O Excel foi exportado, mas ocorreu um erro ao gerar o PDF."
        );


        return false;

      }


      return true;

    }


    // =========================================================
    // ABRIR CONFIRMAÇÃO DE EXPORTAÇÃO
    // =========================================================

    function abrirConfirmacaoExportar() {


      if (dados.length === 0) {


        alert(
          "Não existem dados para exportar."
        );


        return;

      }


      confirmacaoExportar.style.display =
        "flex";

    }


    // =========================================================
    // BOTÃO EXPORTAR
    // =========================================================

    botaoExportar.onclick =
      function () {


        abrirConfirmacaoExportar();

      };


    // =========================================================
    // BOTÃO EXPORTAR DO MODAL
    // =========================================================

    botaoExportarModal.onclick =
      function () {


        abrirConfirmacaoExportar();

      };


    // =========================================================
    // BOTÃO PDF
    // =========================================================

    botaoExportarPdf.onclick =
      function () {


        abrirConfirmacaoExportar();

      };


    // =========================================================
    // BOTÃO PDF DO MODAL
    // =========================================================

    botaoExportarPdfModal.onclick =
      function () {


        abrirConfirmacaoExportar();

      };


    // =========================================================
    // CONFIRMAR EXPORTAÇÃO
    // =========================================================

    btnSimExportar.onclick =
      function () {


        if (dados.length === 0) {


          confirmacaoExportar.style.display =
            "none";


          return;

        }


        // -----------------------------------------------------
        // DESABILITAR BOTÃO DURANTE EXPORTAÇÃO
        // -----------------------------------------------------

        btnSimExportar.disabled =
          true;


        btnSimExportar.textContent =
          "Exportando...";


        // -----------------------------------------------------
        // EXPORTAR EXCEL + PDF
        // -----------------------------------------------------

        const exportado =
          exportarExcelEPDF();


        // -----------------------------------------------------
        // REATIVAR BOTÃO
        // -----------------------------------------------------

        btnSimExportar.disabled =
          false;


        btnSimExportar.textContent =
          "Sim";


        // -----------------------------------------------------
        // SE NÃO EXPORTOU
        // -----------------------------------------------------

        if (!exportado) {


          return;

        }


        // -----------------------------------------------------
        // LIMPAR DADOS APÓS EXPORTAÇÃO
        // -----------------------------------------------------

        dados = [];


        salvarDados();


        ultimoCodigo.textContent =
          "-";


        limparUltimosSelects();


        carregarUltimosSelects();


        atualizarUI();


        // -----------------------------------------------------
        // FECHAR CONFIRMAÇÃO
        // -----------------------------------------------------

        confirmacaoExportar.style.display =
          "none";


        // -----------------------------------------------------
        // VOLTAR PARA AUDITOR
        // -----------------------------------------------------

        selectBase.focus();


      };


    // =========================================================
    // CANCELAR EXPORTAÇÃO
    // =========================================================

    btnNaoExportar.onclick =
      function () {


        confirmacaoExportar.style.display =
          "none";

      };


    // =========================================================
    // ABRIR CONFIRMAÇÃO DE LIMPEZA
    // =========================================================

    botaoLimpar.onclick =
      function () {


        if (dados.length === 0) {


          alert(
            "Não existem dados para limpar."
          );


          return;

        }


        confirmacaoLimpar.style.display =
          "flex";

      };


    // =========================================================
    // CONFIRMAR LIMPEZA
    // =========================================================

    btnSimLimpar.onclick =
      function () {


        dados = [];


        salvarDados();


        ultimoCodigo.textContent =
          "-";


        limparUltimosSelects();


        carregarUltimosSelects();


        atualizarUI();


        confirmacaoLimpar.style.display =
          "none";


        erroMsg.textContent =
          "";


        limiteMsg.textContent =
          "";


        selectBase.focus();

      };


    // =========================================================
    // CANCELAR LIMPEZA
    // =========================================================

    btnNaoLimpar.onclick =
      function () {


        confirmacaoLimpar.style.display =
          "none";

      };


    // =========================================================
    // FECHAR CONFIRMAÇÃO DE EXPORTAÇÃO CLICANDO FORA
    // =========================================================

    confirmacaoExportar.addEventListener(

      "click",

      function (e) {


        if (
          e.target ===
          confirmacaoExportar
        ) {


          confirmacaoExportar.style.display =
            "none";

        }

      }

    );


    // =========================================================
    // FECHAR CONFIRMAÇÃO DE LIMPEZA CLICANDO FORA
    // =========================================================

    confirmacaoLimpar.addEventListener(

      "click",

      function (e) {


        if (
          e.target ===
          confirmacaoLimpar
        ) {


          confirmacaoLimpar.style.display =
            "none";

        }

      }

    );


    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    carregarUltimosSelects();


    atualizarUI();


    inputCodigo.focus();


  </script>
